name: PaperLib CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend regression tests
        run: pytest -q tests/
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test graph edge aggregation
        working-directory: frontend
        run: npm run test:graph
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Smoke test the real production launcher
        shell: pwsh
        run: |
          $env:PAPERLIB_NO_BROWSER = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "paperlib-launcher.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "paperlib-launcher.stderr.log"
          $launcher = Start-Process -FilePath $env:ComSpec -ArgumentList '/c "启动.bat"' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          try {
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8300/api/papers" -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              if ($launcher.HasExited) { break }
            }
            if (-not $ready) {
              Write-Host "Launcher stdout:"
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "Launcher stderr:"
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "启动.bat did not serve /api/papers within 180 seconds."
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8300/" -TimeoutSec 5
            if ($page.StatusCode -ne 200) { throw "Production frontend returned HTTP $($page.StatusCode)." }
          } finally {
            $listeners = Get-NetTCPConnection -LocalPort 8300 -State Listen -ErrorAction SilentlyContinue
            foreach ($listener in $listeners) {
              Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue
            }
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
            }
          }
